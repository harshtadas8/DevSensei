services:
  # 1. ChromaDB Vector Store
  chromadb:
    image: chromadb/chroma:latest
    container_name: devsensei-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
    restart: unless-stopped

  # 2. Agent Orchestrator API (FastAPI)
  orchestrator:
    build:
      context: ./apps/agent-orchestrator
      dockerfile: Dockerfile
    container_name: devsensei-orchestrator
    ports:
      - "8000:8000"
    volumes:
      - ./apps/agent-orchestrator:/app
      - ./apps/mcp-server:/mcp-server
      - huggingface_cache:/root/.cache/chroma
    env_file:
      - .env
    environment:
      - CHROMA_DB_URL=http://chromadb:8000
      - LOG_LEVEL=debug
    depends_on:
      - chromadb
    restart: unless-stopped

  # 3. Frontend (Next.js)
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: devsensei-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://orchestrator:8000
    depends_on:
      - orchestrator
    restart: unless-stopped

volumes:
  chroma_data:
  huggingface_cache:
