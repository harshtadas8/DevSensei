services:
  # 1. Agent Orchestrator API (FastAPI)
  orchestrator:
    build:
      context: ./apps/agent-orchestrator
      dockerfile: Dockerfile
    container_name: devsensei-orchestrator
    ports:
      - "8000:8000"
    volumes:
      - ./apps/agent-orchestrator:/app
      - ./apps/mcp-server:/mcp-server
      - huggingface_cache:/root/.cache/chroma
    env_file:
      - .env
    environment:
      - LOG_LEVEL=debug
    restart: unless-stopped

  # 3. Frontend (Next.js)
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: devsensei-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - BACKEND_API_URL=http://orchestrator:8000
    depends_on:
      - orchestrator
    restart: unless-stopped

volumes:
  chroma_data:
  huggingface_cache:
