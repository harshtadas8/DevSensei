name: "DevSensei Enterprise Guardrails"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  evaluate-ai-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -e apps/agent-orchestrator
          uv pip install --system pytest

      - name: Run Unit Tests
        run: |
          pytest apps/agent-orchestrator/tests/

      - name: Run Eval Scorer
        run: |
          python eval/scorer.py
