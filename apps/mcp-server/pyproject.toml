[project]
name = "mcp-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "harshtadas8", email = "harshtadas8@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "gitpython>=3.1.59",
    "mcp>=2.0.0",
    "pathspec>=1.1.1",
    "pydantic>=2.13.4",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
]

[project.scripts]
mcp-server = "mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
